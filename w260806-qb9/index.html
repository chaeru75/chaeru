html,body{height:100%;margin:0;padding:0;overflow:hidden;background:transparent}
body{display:flex;justify-content:center;align-items:center;-webkit-tap-highlight-color:transparent}
:root{--lp:0%;--lx:50%;--ly:50%}
body{user-select:none;-webkit-user-select:none}
.lenticular{position:relative;width:min(390px,90vw,calc(92vh*0.7500));aspect-ratio:3 / 4;perspective:1200px;cursor:ew-resize;touch-action:none}
.lenticular{cursor:ns-resize}
.lent-card{position:absolute;inset:0;overflow:hidden;transform-style:preserve-3d;will-change:transform;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .32s cubic-bezier(.2,.75,.25,1);border-radius:0;background:transparent;box-shadow:none}

.lent-layer img{display:block;width:100%;height:100%;object-fit:cover;transform-origin:center;will-change:transform}
.lent-lens,.lent-glint{position:absolute;inset:0;z-index:5;pointer-events:none}
.lent-lens{opacity:.3;mix-blend-mode:soft-light;background:repeating-linear-gradient(0deg,rgba(255,255,255,.68) 0 1px,rgba(20,30,38,.3) 1px 2px,transparent 2px 6px);background-position:0 var(--lp);background-size:100% 12px}
.lent-glint{opacity:.44;mix-blend-mode:screen;background:radial-gradient(circle at var(--lx) var(--ly),rgba(255,255,255,.72),rgba(172,235,255,.22) 18%,transparent 45%)}
.lent-card::after{content:"";position:absolute;z-index:8;inset:0;border-radius:0;pointer-events:none;box-shadow:none}
.lenticular::after{content:"";position:absolute;z-index:-1;left:8%;right:8%;bottom:-5%;height:10%;border-radius:50%;background:radial-gradient(ellipse,rgba(16,24,38,.32),transparent 70%);filter:blur(8px)}
.lenticular.editing{cursor:default}.lenticular.editing .lent-card{transform:none!important;transition:none!important}
.lenticular.editing .lent-lens,.lenticular.editing .lent-glint{display:none}
@media (prefers-reduced-motion:reduce){.lent-card{transform:none!important;transition:none!important}.lent-layer{transition:none!important}}

root.addEventListener("pointerleave",function(){root.classList.remove("moving");apply(step/Math.max(1,n-1));});
root.addEventListener("click",function(e){step=(step+1)%n;apply(step/Math.max(1,n-1));});apply(0);
})();
