<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>camera</title>
<script>
(function(){try{
if(!('IntersectionObserver' in window))return;
var io=new IntersectionObserver(function(es){
  var v=es[0]&&es[0].isIntersecting;
  document.documentElement.classList.toggle('mk-off',!v);
},{threshold:0});
io.observe(document.documentElement);
}catch(e){}})();

<style>
.mk-off *{animation-play-state:paused !important}
html,body{height:100%;margin:0;padding:0;overflow:hidden;background:transparent}
body{display:flex;justify-content:center;align-items:center;-webkit-tap-highlight-color:transparent}
.cam{position:relative;width:min(520px, 94vw, calc(92vh * 1.3333));aspect-ratio:4 / 3;touch-action:manipulation;border-radius:18px;overflow:hidden;cursor:pointer;background:#0c0c10;box-shadow:0 16px 38px rgba(0,0,0,.35)}
.camera-effect-mask{position:absolute;inset:0;overflow:hidden;z-index:4;pointer-events:none}
.scw{position:absolute;top:0;left:0;width:100%;height:100%;will-change:transform}
.scene{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;will-change:transform;transition:filter .5s ease}
.cam.foc .scene{filter:blur(7px) brightness(.97)}
@media (prefers-reduced-motion: no-preference){
.scene{animation:kb 16s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1.04) translate(0,0)}to{transform:scale(1.12) translate(-1.6%,1.2%)}}
}
.vf{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:5}
.cor{position:absolute;width:30px;height:30px;border:3px solid rgba(255,255,255,.85)}
.c1{left:14px;top:14px;border-right:none;border-bottom:none}
.c2{right:14px;top:14px;border-left:none;border-bottom:none}
.c3{left:14px;bottom:14px;border-right:none;border-top:none}
.c4{right:14px;bottom:14px;border-left:none;border-top:none}
.focus{position:absolute;left:50%;top:50%;width:26%;aspect-ratio:1;transform:translate(-50%,-50%);border:2px solid rgba(255,255,255,.65);border-radius:8px;will-change:transform,opacity}
@media (prefers-reduced-motion: no-preference){
.cam:hover .focus{animation:fpulse 1.5s ease-in-out infinite}
@keyframes fpulse{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.65}50%{transform:translate(-50%,-50%) scale(.95);opacity:1}}
.dot{animation:blink 1.2s step-end infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}
}
.rec{position:absolute;left:18px;top:15px;display:flex;align-items:center;gap:7px;color:#fff;font:700 12px Consolas,monospace;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.dot{width:9px;height:9px;border-radius:50%;background:#ff4545}
.info{position:absolute;right:18px;top:16px;color:rgba(255,255,255,.85);font:600 11px Consolas,monospace;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.zoombar{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.75);font:600 11px Consolas,monospace;letter-spacing:2px;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.bladeT,.bladeB{position:absolute;left:0;width:100%;height:52%;background:#000;z-index:8;will-change:transform}
.bladeT{top:0;transform:translateY(-103%)}
.bladeB{bottom:0;transform:translateY(103%)}
.cam.snap .bladeT{animation:bT .5s ease}
.cam.snap .bladeB{animation:bB .5s ease}
@keyframes bT{0%{transform:translateY(-103%)}42%,58%{transform:translateY(0)}100%{transform:translateY(-103%)}}
@keyframes bB{0%{transform:translateY(103%)}42%,58%{transform:translateY(0)}100%{transform:translateY(103%)}}
.flash{position:absolute;top:0;left:0;width:100%;height:100%;background:#fff;opacity:0;z-index:9;pointer-events:none;will-change:opacity}
.cam.snap .flash{animation:fl .55s ease .18s}
@keyframes fl{0%{opacity:0}45%{opacity:.95}100%{opacity:0}}
.pola{position:absolute;left:50%;top:50%;width:50%;z-index:12;transform:translate(-50%,150%) rotate(0deg);transition:transform .85s cubic-bezier(.2,.75,.25,1.06);will-change:transform;background:#fdfdfa;padding:4% 4% 13% 4%;box-shadow:0 18px 38px rgba(0,0,0,.45)}
.cam.shot .pola{transform:translate(-50%,-54%) rotate(-4deg)}
.pw{width:100%;aspect-ratio:1;overflow:hidden}
.pw img{width:100%;height:100%;object-fit:cover;display:block}
.pcap{position:absolute;left:0;right:0;bottom:3.5%;text-align:center;color:#8a8578;font:italic 700 13px Georgia,serif}
</style>
<style>.mk-key-focus:focus-visible{outline:3px solid #ffd66b!important;outline-offset:4px!important}</style>
<style>
#mk-common-decor{position:fixed;inset:0;width:100vw;height:100vh;z-index:2147483646;pointer-events:none!important;overflow:hidden;contain:layout style;transform:none}
#mk-common-decor img{display:block;width:100%;height:100%;object-fit:fill;pointer-events:none!important;user-select:none}
</style>
</head>
<body>
<div class="cam foc" id="cam" data-mk-adjust-box="scene">
  <div class="scw"><img class="scene" src="./1.webp" alt=""></div>
  <div class="vf">
    <div class="cor c1"></div><div class="cor c2"></div><div class="cor c3"></div><div class="cor c4"></div>
    <div class="focus"></div>
    <div class="rec"><span class="dot"></span>REC</div>
    <div class="info">AUTO&nbsp;&nbsp;ISO 200</div>
    <div class="zoombar">W ━━━●━━ T</div>
  </div>
  <div class="bladeT"></div><div class="bladeB"></div><div class="flash"></div>
  <div class="pola"><div class="pw"><img src="./2.webp" alt=""></div><div class="pcap" id="pcap"></div></div>
</div>

function sparks(host,n){

    ],{duration:650+Math.random()*400,easing:"cubic-bezier(.15,.75,.4,1)"})

  }
}
