<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>spotlight</title>
<script>
(function(){try{
if(!('IntersectionObserver' in window))return;
var io=new IntersectionObserver(function(es){
  var v=es[0]&&es[0].isIntersecting;
  document.documentElement.classList.toggle('mk-off',!v);
},{threshold:0});
io.observe(document.documentElement);
}catch(e){}})();
</script>
<style>
.mk-off *{animation-play-state:paused !important}
html,body{height:100%;margin:0;padding:0;overflow:hidden;background:transparent}
body{display:flex;justify-content:center;align-items:center;-webkit-tap-highlight-color:transparent}
.sw{position:relative;line-height:0;border-radius:22px;overflow:hidden;cursor:pointer;touch-action:manipulation;box-shadow:0 18px 42px rgba(0,0,0,.30)}
.sw img.base{max-width:96vw;max-height:94vh;width:auto;height:auto;display:block;transform-origin:center;will-change:transform}
.dark{position:absolute;top:0;left:0;width:100%;height:100%;z-index:2;overflow:hidden;transition:opacity .6s ease;will-change:opacity}
.sw.rv .dark{opacity:0;pointer-events:none}
.hole{position:absolute;left:-95px;top:-95px;width:190px;height:190px;border-radius:50%;will-change:transform;background:radial-gradient(circle,rgba(4,4,14,0) 0 38%,rgba(4,4,14,.6) 60%,rgba(4,4,14,.995) 76%);box-shadow:0 0 0 9999px rgba(4,4,14,.995)}
.hint{position:absolute;left:0;right:0;bottom:6%;text-align:center;z-index:3;color:#ffffff;font:700 14px sans-serif;opacity:.85;text-shadow:0 1px 6px rgba(0,0,0,.9);transition:opacity .5s ease;pointer-events:none}
.sw.rv .hint{opacity:0}
</style>
<style>.mk-key-focus:focus-visible{outline:3px solid #ffd66b!important;outline-offset:4px!important}</style>
</head>
<body>
<div class="sw" id="sw">
  <img class="base" data-mk-adjust-box="base" src="./1.webp" alt="">
  <div class="dark"><div class="hole" id="hole"></div></div>
  <div class="hint" id="hint">🔦 비춰보세요 · 클릭하면 공개</div>
</div>
<script>
(function(){
function sparks(host,n){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  var colors=["#ffd97a","#ffe9b0","#ffc65c","#fff3d6"];
  for(var i=0;i<n;i++){
    var s=document.createElement("span");
    s.textContent=Math.random()<.55?"\u2726":"\u25CF";
    s.style.cssText="position:absolute;left:50%;top:50%;z-index:40;pointer-events:none;"
      +"font:700 "+(9+Math.random()*13)+"px sans-serif;color:"+colors[i%4]+";"
      +"text-shadow:0 0 6px rgba(255,215,130,.8);transform:translate(-50%,-50%);will-change:transform,opacity";
    host.appendChild(s);
    var a=Math.random()*Math.PI*2,d=80+Math.random()*150;
    var dx=Math.cos(a)*d,dy=Math.sin(a)*d-30;
    s.animate([
      {transform:"translate(-50%,-50%) scale(.4) rotate(0deg)",opacity:1},
      {transform:"translate(calc(-50% + "+dx+"px), calc(-50% + "+dy+"px)) scale(1.15) rotate("+(Math.random()*260-130)+"deg)",opacity:0}
    ],{duration:650+Math.random()*400,easing:"cubic-bezier(.15,.75,.4,1)"})
    .onfinish=(function(el){return function(){el.remove();};})(s);
  }
}
var RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
var sw=document.getElementById('sw'),hole=document.getElementById('hole'),
  hint=document.getElementById('hint');
var px=-999,py=-999,tx=-999,ty=-999,moved=false,revealed=false;
var lastAct=0;
function setP(cx,cy){
  var r=sw.getBoundingClientRect();
  px=cx-r.left;py=cy-r.top;
  lastAct=performance.now();
  if(!moved){moved=true;hint.style.opacity=0;}
}
sw.addEventListener('pointermove',function(e){setP(e.clientX,e.clientY);});
sw.addEventListener('touchmove',function(e){
  setP(e.touches[0].clientX,e.touches[0].clientY);
},{passive:true});
function loop(t){
  if(!revealed){
    if(moved&&t-lastAct>4000){moved=false;hint.style.opacity='';}
    if(!moved){
      var W=sw.offsetWidth,H=sw.offsetHeight;
      if(RM){px=W/2;py=H/2;}
      else{px=W/2+Math.cos(t/1500)*W*.2;py=H/2+Math.sin(t/1150)*H*.16;}
    }
    if(tx===-999){tx=px;ty=py;}
    tx+=(px-tx)*.16;ty+=(py-ty)*.16;
    hole.style.transform='translate('+tx+'px,'+ty+'px)';
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
var downX=0,downY=0;
sw.addEventListener('pointerdown',function(e){downX=e.clientX;downY=e.clientY;});
sw.addEventListener('click',function(e){
  if(Math.abs(e.clientX-downX)+Math.abs(e.clientY-downY)>12)return;
  revealed=!revealed;
  sw.classList.toggle('rv',revealed);
  if(revealed)sparks(sw,12);
});
})();
</script>
<script>
(function(){
var nodes=[].slice.call(document.querySelectorAll("#sw"));
nodes.forEach(function(el){el.tabIndex=0;el.setAttribute("role","button");el.setAttribute("aria-label","사진 공개하기");el.classList.add("mk-key-focus");
el.addEventListener("keydown",function(e){if(e.key!=="Enter"&&e.key!==" ")return;e.preventDefault();el.click();});});
})();
</script>
</body>
</html>
